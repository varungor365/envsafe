[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envsafe"
version = "0.1.0"
description = "Secret-safe .env inspection, validation, and redaction."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Varun Ruhella"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
envsafe = "envsafe.cli:main"

[tool.setuptools.packages.find]
include = ["envsafe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
